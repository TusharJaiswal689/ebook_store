<!DOCTYPE html>
<html>
<body>
  <h2>Add Book</h2>
  <form id="fa">
    Title: <input name="title" placeholder="ex: MyBook" /><br><br>
    Author: <input name="author" placeholder="ex: Tushar" /><br><br>
    Description: <input name="description" placeholder="ex: abc" /><br><br>
    Rating: <input name="rating" placeholder="ex:1-5"/><br><br>
    <button type="submit">Submit</button>
  </form>
  <br>
  <h2> Update Book</h2>
  <form id="fu">
    Book Id: <input name="book_id" placeholder="enter the book id to update."/><br><br>
    Title: <input name="title" placeholder="enter new title"/><br><br>
    Author: <input name="author" placeholder="ex: Tushar" /><br><br>
    Description: <input name="description" placeholder="ex: abc" /><br><br>
    Rating: <input name="rating" placeholder="ex:1-5"/><br><br>
    <button type="submit">Update</button>
  </form>
  <br>
  <h2>Get Books</h2>
  <button type="button" id="get_books">Show Books</button>
  <br>
  <pre id="out"></pre>


  <script>
    document.getElementById("fa").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));

      const res = await fetch("http://localhost:8000/books/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
      e.target.reset();
    });

    document.getElementById("fu").addEventListener("submit", async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const book_id = data.book_id;
    delete data.book_id;

    for (const key of Object.keys(data)) {
      if (data[key] === "") delete data[key];
  }

    const res = await fetch(`http://localhost:8000/books/update/${book_id}`,{
      method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(data)
    });

    document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    e.target.reset();
  });

  document.getElementById("get_books").addEventListener("click", async ()=> {
    const res = await fetch("http://localhost:8000/books");
    document.getElementById("out").textContent = JSON.stringify(await res.json(), null, 2);
    });
  </script>
</body>
</html>
